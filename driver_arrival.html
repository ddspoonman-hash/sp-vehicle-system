<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>到着</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }
    .chip{
      padding:10px 14px;
      background:#eee;
      border-radius:20px;
      font-size:14px;
      cursor:pointer;
      user-select:none;
    }
    .chip.active{
      background:#007bff;
      color:#fff;
    }
    .tab{
      display:inline-block;
      padding:8px 12px;
      margin-right:6px;
      margin-top:6px;
      background:#ddd;
      border-radius:10px;
      cursor:pointer;
      user-select:none;
    }
    .tab.active{
      background:#007bff;
      color:#fff;
    }
    .warn{
      margin-top:10px;
      padding:10px;
      border-radius:10px;
      background:#fff3cd;
      color:#856404;
      font-size:14px;
    }
    .bottom-space{
      height:90px;
    }
  </style>
</head>
<body>
  <div class="header">到着処理</div>

  <div class="card">
    <h3>運転者</h3>
    <select id="driverSelect"></select>

    <h3>同乗者</h3>
    <div id="groupTabs"></div>
    <div id="passengerList" class="chips"></div>
    <input id="passengerOther" placeholder="その他">

    <h3>行き先</h3>
    <div id="destList" class="chips"></div>
    <input id="destOther" placeholder="その他">

    <h3>用件</h3>
    <div id="purposeList" class="chips"></div>
    <input id="purposeOther" placeholder="その他">

    <h3>備考</h3>
    <input id="memo">

    <h3>開始メーター</h3>
    <input id="startMeterView" readonly>

    <h3>到着メーター</h3>
    <input id="endMeter" type="number" inputmode="decimal" placeholder="到着時のメーターを入力">

    <div id="meterWarn" class="warn" style="display:none;"></div>
  </div>

  <div class="bottom-space"></div>

  <div class="fixed-btn">
    <button id="arrivalBtn" class="btn-danger">到着</button>
  </div>

  <script src="driver.js?v=20260403-1"></script>
  <script>
    let selectedPassengers = new Set();
    let selectedDest = new Set();
    let selectedPurpose = new Set();
    let allPassengers = [];
    let arrivalSending = false;
    let arrivalDone = false;

    window.addEventListener("load", async () => {
      const user = JSON.parse(localStorage.getItem("user"));
      if(!user){
        location.href = "index.html";
        return;
      }

      try{
        const [drivers, masters] = await Promise.all([
          jsonp(GAS + "?type=drivers"),
          jsonp(GAS + "?type=masters")
        ]);

        initDriverSelect(drivers, user);
        initPassengerArea(masters);
        initDestinations(masters);
        initPurposes(masters);

        const startMeter = String(localStorage.getItem("startMeter") || "");
        document.getElementById("startMeterView").value = startMeter;

        document.getElementById("endMeter").addEventListener("input", updateMeterWarning);
        updateMeterWarning();

        const pending = localStorage.getItem("pendingArrival");
        if(pending){
          document.getElementById("arrivalBtn").textContent = "未送信あり";
        }

        document.getElementById("arrivalBtn").onclick = arrivalEx;
      }catch(e){
        console.error("arrival init error", e);
        alert("到着画面の初期化に失敗しました");
      }
    });

    function initDriverSelect(drivers, user){
      const driverSelect = document.getElementById("driverSelect");
      driverSelect.innerHTML = "";

      (drivers || []).forEach(x => {
        const o = document.createElement("option");
        o.value = x.name;
        o.textContent = x.name;
        if(x.name === user.name) o.selected = true;
        driverSelect.appendChild(o);
      });
    }

    function initPassengerArea(masters){
      allPassengers = masters.passengers || [];

      const groups = [...new Set(allPassengers.map(x => x.group))];
      const groupTabs = document.getElementById("groupTabs");
      groupTabs.innerHTML = "";

      groups.forEach((g, i) => {
        const tab = document.createElement("span");
        tab.className = "tab";
        tab.textContent = g;

        tab.onclick = () => {
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          renderPassengers(g);
        };

        if(i === 0) tab.classList.add("active");
        groupTabs.appendChild(tab);
      });

      if(groups.length > 0){
        renderPassengers(groups[0]);
      }
    }

    function initDestinations(masters){
      const destList = document.getElementById("destList");
      destList.innerHTML = "";
      (masters.destinations || []).forEach(x => createChip(x, destList, selectedDest));
    }

    function initPurposes(masters){
      const purposeList = document.getElementById("purposeList");
      purposeList.innerHTML = "";
      (masters.purposes || []).forEach(x => createChip(x, purposeList, selectedPurpose));
    }

    function renderPassengers(group){
      const passengerList = document.getElementById("passengerList");
      passengerList.innerHTML = "";

      allPassengers
        .filter(x => x.group == group)
        .forEach(x => {
          createChip(x.name, passengerList, selectedPassengers);
        });
    }

    function createChip(text, container, setObj){
      const div = document.createElement("div");
      div.className = "chip";
      div.textContent = text;

      if(setObj.has(text)){
        div.classList.add("active");
      }

      div.onclick = () => {
        if(setObj.has(text)){
          setObj.delete(text);
          div.classList.remove("active");
        }else{
          setObj.add(text);
          div.classList.add("active");
        }
      };

      container.appendChild(div);
    }

    function updateMeterWarning(){
      const warn = document.getElementById("meterWarn");
      const startMeter = Number(localStorage.getItem("startMeter") || 0);
      const endMeter = Number(document.getElementById("endMeter").value || 0);

      if(!endMeter){
        warn.style.display = "none";
        warn.textContent = "";
        return;
      }

      if(endMeter < startMeter){
        warn.style.display = "block";
        warn.textContent = "到着メーターが開始メーターより小さいです。";
        return;
      }

      const diff = endMeter - startMeter;

      if(diff > 200){
        warn.style.display = "block";
        warn.textContent = "走行距離が大きいです。入力値をご確認ください。";
        return;
      }

      warn.style.display = "none";
      warn.textContent = "";
    }

    async function arrivalEx(){
      if(arrivalSending || arrivalDone) return;

      const btn = document.getElementById("arrivalBtn");
      const car = String(localStorage.getItem("lastCar") || "").trim();
      const startMeter = Number(localStorage.getItem("startMeter") || 0);
      const endMeter = Number(document.getElementById("endMeter").value || 0);

      if(!endMeter){
        alert("到着メーターを入力してください");
        return;
      }

      if(endMeter < startMeter){
        alert("到着メーターが開始メーターより小さいです");
        return;
      }

      const diff = endMeter - startMeter;

      if(diff > 200){
        const ok = confirm("走行距離が大きすぎる可能性があります（" + diff + "km）。このまま登録しますか？");
        if(!ok) return;
      }else{
        const ok = confirm("走行距離：" + diff.toFixed(1) + "km\n\n登録しますか？");
        if(!ok) return;
      }

      arrivalSending = true;
      btn.disabled = true;
      btn.textContent = "送信中...";

      const reqId = "ARR_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);

      const passengers = [
        ...selectedPassengers,
        String(document.getElementById("passengerOther").value || "").trim()
      ].filter(Boolean).join(",");

      const dest = [
        ...selectedDest,
        String(document.getElementById("destOther").value || "").trim()
      ].filter(Boolean).join(",");

      const purpose = [
        ...selectedPurpose,
        String(document.getElementById("purposeOther").value || "").trim()
      ].filter(Boolean).join(",");

      const memo = String(document.getElementById("memo").value || "").trim();
      const driver = String(document.getElementById("driverSelect").value || "").trim();

      localStorage.setItem("pendingArrival", JSON.stringify({
        reqId,
        car,
        endMeter,
        driver,
        passengers,
        destinations: dest,
        purposes: purpose,
        memo
      }));

      const callbackName = "cb_arrival_" + reqId;

      const timeout = setTimeout(() => {
        try{ delete window[callbackName]; }catch(e){}
        arrivalSending = false;
        btn.disabled = false;
        btn.textContent = "再送信";
        alert("通信タイムアウト");
      }, 20000);

      window[callbackName] = function(res){
        clearTimeout(timeout);
        try{ delete window[callbackName]; }catch(e){}

        if(res && res.ok){
          arrivalDone = true;
          localStorage.removeItem("pendingArrival");
          localStorage.removeItem("lastCar");
          localStorage.removeItem("startMeter");
          alert("完了\n距離：" + (res.distance / 1000).toFixed(1) + "km");
          location.href = "driver_start.html";
          return;
        }

        arrivalSending = false;
        btn.disabled = false;
        btn.textContent = "再送信";
        alert("保存失敗\n" + (res && res.message ? res.message : "レスポンスなし"));
      };

      const script = document.createElement("script");
      script.src =
        GAS + "?type=arrivalEx" +
        "&reqId=" + encodeURIComponent(reqId) +
        "&car=" + encodeURIComponent(car) +
        "&endMeter=" + encodeURIComponent(endMeter) +
        "&driver=" + encodeURIComponent(driver) +
        "&passengers=" + encodeURIComponent(passengers) +
        "&destinations=" + encodeURIComponent(dest) +
        "&purposes=" + encodeURIComponent(purpose) +
        "&memo=" + encodeURIComponent(memo) +
        "&callback=" + encodeURIComponent(callbackName) +
        "&t=" + Date.now();

      script.onerror = function(){
        clearTimeout(timeout);
        try{ delete window[callbackName]; }catch(e){}
        arrivalSending = false;
        btn.disabled = false;
        btn.textContent = "再送信";
        alert("送信失敗");
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
